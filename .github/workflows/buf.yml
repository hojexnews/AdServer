# buf (TX-1) — Schema Registry: lint, format-check e breaking-change.
#
# Materializa a regra de TX-1: "A CI roda `buf lint` e `buf breaking`
# para GARANTIR compatibilidade BACKWARD obrigatoria". Um PR que quebre
# a compat com a `main` (reuso de numero de campo, mudanca de tipo,
# remocao sem `reserved`) FALHA aqui antes do merge.
name: buf (TX-1)

on:
  pull_request:
    paths:
      - "proto/**"
      - ".github/workflows/buf.yml"
  push:
    branches: [main]
    # Espelha pull_request.paths VERBATIM — merge para a main aqui é push FF
    # direto, então este bloco é a última (e única) reavaliação. Imposto por
    # scripts/ci/workflow-paths-mirror-check.py; antes da 32ª onda faltava
    # aqui o próprio arquivo do workflow.
    paths:
      - "proto/**"
      - ".github/workflows/buf.yml"

permissions:
  contents: read

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # historico completo: buf breaking compara contra a main.
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          # raiz do modulo buf neste monorepo.
          input: proto
          # lint STANDARD+COMMENTS (buf.yaml).
          lint: true
          # falha se algum .proto nao estiver formatado (buf format).
          format: true
          # compat BACKWARD obrigatoria vs. main (TX-1). WIRE_JSON (buf.yaml).
          breaking: true
          # ATENCAO (self-diff): no evento `push`, o GitHub JA avancou
          # refs/heads/main para o commit sob validacao ANTES de disparar o
          # workflow, entao comparar contra `#branch=main` compararia o commit
          # com ele mesmo -> diff sempre vazio -> `buf breaking` sempre verde,
          # mesmo sob quebra de wire. Como o merge canonico deste repo e FF push
          # direto via SSH, o push-trigger e o UNICO ponto de avaliacao pos-merge;
          # um self-diff aqui neutralizaria o gate de compat. Por isso, no push
          # comparamos contra o PAI do commit (github.event.before), via ref
          # git LOCAL (`.git#ref=`, disponivel por causa do fetch-depth: 0) — o
          # que tambem funciona para PRs de fork sem acesso ao remoto. No
          # pull_request continuamos comparando contra a `main` do repositorio
          # base (o HEAD do PR vs. a base = diff real).
          breaking_against: "${{ github.event_name == 'push' && format('.git#ref={0},subdir=proto', github.event.before) || format('https://github.com/{0}.git#branch=main,subdir=proto', github.repository) }}"
          # nao publicamos no BSR a partir da CI (sem token); so validamos.
          push: false

      # Verifica que gen/ esta em sync com os .proto atuais (TX-1 / staleness gate).
      # Usa o mesmo alvo do Makefile para manter fonte unica de verdade.
      # buf ja esta no PATH do runner via buf-action.
      #
      # Pega DRIFT DE SCHEMA (um .proto mudou sem regenerar gen/) — deve falhar.
      # NAO pega diff cosmetico de versao de gerador: os plugins em
      # proto/buf.gen.yaml sao FIXADOS por versao (pin), entao um bump de
      # `latest` que so muda o header "@generated by" nao reprova o merge.
      - name: gen/ staleness check (proto-gen-check)
        run: make proto-gen-check

      # ------------------------------------------------------------------
      # make-quoting-check MUDOU-SE DAQUI na 32a onda -> repo-gates.yml.
      #
      # Historico, porque a licao e o valor: a onda "perfil BETA" detectou que
      # o alvo era orfao (estava so em `make verify`, e NENHUM workflow roda
      # `make verify`) e o cabeou aqui. Mas a superficie que ele guarda e
      # `Makefile` + `make/*.mk`, e o gatilho DESTE workflow e `paths:
      # proto/**` — entao o conserto do orfao nasceu orfao de novo, um nivel
      # acima: editar make/dev.mk nunca acionou o gate. Um gate de superficie
      # ampla so para de ser orfao num workflow SEM filtro de path.
      #
      # Ver .github/workflows/repo-gates.yml (criterio de admissao no cabecalho).
