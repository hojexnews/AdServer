# no-float (TX-2) — float PROIBIDO em codigo monetario: proto + 4 linguagens.
#
# O escopo NAO e uniforme e NAO e mais "so money/ledger/billing/payments/
# migrations" — a 28a onda provou que escopar por diretorio/nome "financeiro" e
# ponto-cego ativo. Hoje ele e MISTO: default-deny sobre toda a superficie em
# proto (`proto/adserver/**`), SQL (todo `.sql` rastreado, menos data/clickhouse/
# e data/iceberg/, que vao no guard irmao) e TS/TSX por CONTEUDO; escopo positivo
# por caminho em Go e Python, onde float nunca e legitimo. O que se mantem em
# todos: nao punir float legitimo de ML/telemetria — isso sai por allowlist/
# excecao explicita, nao por estreitar o escopo.
#
# NAO replique a regra de selecao aqui: a fonte unica e contracts/lint/no-float.md
# (secao "Escopo"), e sobre ela os scripts em scripts/ci/ vencem em caso de
# divergencia. Este cabecalho descreve a FORMA do escopo, nao o censo de arquivos.
name: no-float (TX-2)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-float:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Proto — sem float/double em Money/Payments (TX-2, nivel de contrato)
        run: bash scripts/ci/no-float-proto.sh
      - name: Go — sem float em dinheiro
        run: bash scripts/ci/no-float-go.sh
      - name: TypeScript — lint financeiro (ESLint, arquivos reais de dinheiro do BFF)
        run: |
          set -euo pipefail
          # Convencao real do repo: ARQUIVO money.ts/payments.ts (nao diretorio
          # money/, payments/ — o glob antigo '**/{money,...}/**/*.ts' so
          # casava gen/ts/**, nunca a convencao real de arquivo do BFF).
          FILES=$(git ls-files 'bff/src/**/*.ts' \
            | grep -E '(^|/)[^/]*(money|ledger|billing|payments)[^/]*\.ts$' \
            | grep -v '\.test\.ts$' || true)
          if [ -n "$FILES" ]; then
            npm ci --prefix bff
            node bff/node_modules/eslint/bin/eslint.js --no-config-lookup -c eslint.config.mjs $FILES
          else
            echo "sem TS financeiro real (ok)"
          fi
      - name: TypeScript/TSX — backstop por CONTEUDO (BFF + console, independente do nome do arquivo)
        run: bash scripts/ci/no-float-ts.sh
      - name: Python — sem float em dinheiro
        run: bash scripts/ci/no-float-py.sh
      - name: SQL/migrations — sem FLOAT/MONEY
        run: bash scripts/ci/no-float-sql.sh
