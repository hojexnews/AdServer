# web (Fase 1) — console Next.js: typecheck + lint + testes unitários.
#
# Materializa o gate `make web-ci` (tsc --noEmit strict + `eslint --max-warnings 0`
# — o Next 16 removeu `next lint`, G0/E10 — + node:test), que era ÓRFÃO: nenhum
# workflow o acionava e ele não está no agregado `verify` da raiz. (sweep item 6, CI-3)
#
# Node 24: `make web-test` roda os testes via runner nativo do Node (node:test)
# com type-stripping nativo de .ts — disponível sem flag a partir do Node 22.18/24.
# Fixado em 24 (baseline do repo) para não depender do minor exato do 22.x. (G0/E9)
name: web (Fase 1)

# O filtro inclui bff/** de propósito: o typecheck do console carrega
# bff/src/** no program (src/types/bff.ts reexporta AppRouter do BFF), logo uma
# mudança SÓ no BFF pode quebrar `make web-ci`. Sem este path, o PR que quebra
# passa verde aqui e o vermelho só aparece no próximo PR que tocar o console.
on:
  pull_request:
    paths:
      - "web/console/**"
      - "bff/**"
      - "make/web.mk"
      - "make/bff.mk"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/console/**"
      - "bff/**"
      - "make/web.mk"
      - "make/bff.mk"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  web-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install deps (console)
        run: make web-install
      # Obrigatório: o tsc do console resolve pg/zod/@trpc/server a partir de
      # bff/node_modules (ver make/web.mk, alvo web-bff-deps). Sem este passo o
      # job morria com TS2307 em cascata.
      - name: install deps (bff — exigido pelo typecheck do console)
        run: make bff-install
      - name: ci (typecheck + lint + test)
        run: make web-ci
