# go (Fase 1) — hot path: build, vet, test e golden de paridade.
#
# Materializa o gate "go test verde" da Fase 1. O motor Go (cascata DA-3,
# regras §4.6, capping DA-6, collector lg/ck/ct) e a suite de paridade
# (tests/parity, gate de cutover) rodam SEM infra externa (testes que exigem
# Redis/Redpanda/MaxMind sao //go:build integration e NAO rodam aqui).
#
# node_modules/ (web/ e bff/ sao projetos npm) nao existe neste job — nao ha
# `npm install` — entao `./...` ja e limpo; ainda assim os alvos de make/go.mk
# excluem node_modules por robustez.
name: go (Fase 1)

on:
  pull_request:
    paths:
      - "internal/**"
      - "services/**"
      - "tests/**"
      - "gen/go/**"
      - "go.mod"
      - "go.sum"
      - "make/go.mk"
      - "make/parity.mk"
      - ".golangci.yml"
      - ".github/workflows/go.yml"
      # Paridade cross-language (anti-skew treino<->serving): o lado Go
      # internal/ranker/parity_test.go::TestParityFromFixtures le a fixture
      # COMPARTILHADA ml/features/testdata/parity_cases.json (gerada a partir da
      # impl Python ml/features/python/featurize.py contra ml/features/spec/).
      # Sem estes paths, um PR que edite SO a featurizacao Python + a fixture
      # (ambos ml/**) nunca dispararia este job -> o gate Go de paridade nao
      # rodaria para a exata classe de mudanca que ele existe para barrar.
      - "ml/features/testdata/parity_cases.json"
      - "ml/features/python/**"
      - "ml/features/spec/**"
  push:
    branches: [main]
    paths:
      - "internal/**"
      - "services/**"
      - "tests/**"
      - "gen/go/**"
      - "go.mod"
      - "go.sum"
      # merges = FF push direto -> push.paths deve espelhar pull_request.paths
      # (mesma paridade cross-language; ver comentario acima).
      - "ml/features/testdata/parity_cases.json"
      - "ml/features/python/**"
      - "ml/features/spec/**"

permissions:
  contents: read

env:
  # Segredos de TESTE — o boot real e fail-closed (sem estes vars o servico
  # recusa subir). Aqui sao valores ficticios so para a suite de testes.
  CAPPING_SALT: ci-test-salt-not-a-real-secret
  CK_HMAC_SECRET: ci-test-hmac-not-a-real-secret

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: build
        run: make go-build
      - name: vet
        run: make go-vet
      - name: lint (forbidigo TX-2 — float PROIBIDO em codigo monetario)
        run: make go-lint
      - name: test (unit + golden, -race)
        run: make go-test
      - name: parity golden (gate de cutover, sem infra)
        run: make parity-golden
