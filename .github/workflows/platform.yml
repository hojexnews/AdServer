# platform-validate — validacao offline da plataforma (Fase 3, hardening go-live).
#
# Roda SEM credenciais e SEM cluster vivo:
#   1. tofu init -backend=false && tofu validate  (OpenTofu schema check)
#   2. kubeconform sobre platform/k8s/, platform/gitops/, platform/cells/{pci,aml-kyc}/
#      platform/observability/  (K8s/CRD schema validation, ignora CRDs desconhecidos)
#   3. kyverno test sobre platform/k8s/policy/, platform/cells/pci/policy/,
#      platform/cells/aml-kyc/policy/  (asserts de accept/reject offline)
#   4. otelcol validate --config platform/observability/otel-collector.yaml
#      + verificacao estrutural dos processadores de redacao de PII (TX-5)
#
# Aciona em PR/push apenas quando platform/ ou make/platform.mk forem alterados.
# Nao exige aprovacao cloud — tudo estatico.
name: platform-validate

on:
  pull_request:
    paths:
      - "platform/**"
      - "make/platform.mk"
      - ".github/workflows/platform.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - "make/platform.mk"
      - ".github/workflows/platform.yml"

permissions:
  contents: read

env:
  # Versoes espelhadas em make/platform.mk — manter em sincronia.
  KUBECONFORM_VER: "0.7.0"
  KYVERNO_CLI_VER: "1.13.4"
  TOFU_VER: "1.9.1"
  # Imagem do OTel Collector contrib para validacao semantica (TX-5).
  # Espelha OTELCOL_IMAGE em make/platform.mk — manter em sincronia.
  OTELCOL_IMAGE: "otel/opentelemetry-collector-contrib:0.123.0"
  # SHA256 fixados dos tarballs de ferramentas.
  # Atualizar ao bumpar versoes acima. Verificado antes de extrair (M-1).
  # Digests obtidos de:
  #   kubeconform: https://github.com/yannh/kubeconform/releases/download/v0.7.0/CHECKSUMS
  #   kyverno:     https://github.com/kyverno/kyverno/releases/download/v1.13.4/checksums.txt
  #   tofu:        https://github.com/opentofu/opentofu/releases/download/v1.9.1/tofu_1.9.1_SHA256SUMS
  KUBECONFORM_SHA256: "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3"
  KYVERNO_SHA256: "abd318dbb971ab6de2bbe3b7226f4a03230d5c9c651df8a29b6b5e085a55aeeb"
  TOFU_SHA256: "ebb3eb2d12833422543c3f04a7ec21d9fd260e893ad221c63dbcf0a319ff563a"

jobs:
  platform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # OpenTofu — download com verificacao de integridade SHA256 (M-1).
      # ------------------------------------------------------------------
      - name: instalar OpenTofu
        run: |
          TARBALL="tofu_${TOFU_VER}_linux_amd64.tar.gz"
          URL="https://github.com/opentofu/opentofu/releases/download/v${TOFU_VER}/${TARBALL}"
          curl -fsSL -o "/tmp/${TARBALL}" "${URL}"
          echo "${TOFU_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          sudo tar -xzf "/tmp/${TARBALL}" -C /usr/local/bin tofu
          rm -f "/tmp/${TARBALL}"
          tofu version

      # ------------------------------------------------------------------
      # kubeconform — download com verificacao de integridade SHA256 (M-1).
      # ------------------------------------------------------------------
      - name: instalar kubeconform
        run: |
          TARBALL="kubeconform-linux-amd64.tar.gz"
          URL="https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VER}/${TARBALL}"
          curl -fsSL -o "/tmp/${TARBALL}" "${URL}"
          echo "${KUBECONFORM_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          sudo tar -xzf "/tmp/${TARBALL}" -C /usr/local/bin kubeconform
          rm -f "/tmp/${TARBALL}"
          kubeconform --version

      # ------------------------------------------------------------------
      # kyverno CLI — download com verificacao de integridade SHA256 (M-1).
      # Nota: o asset real para v1.13.4 e kyverno-cli_v<ver>_linux_x86_64.tar.gz
      # (nao kyverno_linux_amd64.tar.gz). O binario dentro do tarball e "kyverno".
      # ------------------------------------------------------------------
      - name: instalar kyverno CLI
        run: |
          TARBALL="kyverno-cli_v${KYVERNO_CLI_VER}_linux_x86_64.tar.gz"
          URL="https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_CLI_VER}/${TARBALL}"
          curl -fsSL -o "/tmp/${TARBALL}" "${URL}"
          echo "${KYVERNO_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          sudo tar -xzf "/tmp/${TARBALL}" -C /usr/local/bin kyverno
          rm -f "/tmp/${TARBALL}"
          kyverno version

      # ------------------------------------------------------------------
      # Alvos de validacao (PLATFORM_STRICT=1: falha em ausencia de ferramenta)
      # ------------------------------------------------------------------
      - name: tofu validate (sem backend, sem credenciais)
        run: PLATFORM_STRICT=1 make platform-tofu-validate

      - name: kubeconform (schemas K8s/CRD, ignore missing)
        run: PLATFORM_STRICT=1 make platform-kubeconform

      - name: kyverno test (policies PCI + AML/KYC + baseline, offline)
        run: PLATFORM_STRICT=1 make platform-kyverno-test

      # ------------------------------------------------------------------
      # OTel Collector — validacao semantica (TX-5, privacy Ressalva 1).
      # Roda otelcol validate --config via Docker (imagem pinada OTELCOL_IMAGE)
      # + verificacao estrutural dos processadores de redacao de PII.
      # Docker esta disponivel em ubuntu-latest por padrao.
      #
      # FIX (11a onda): os exporters usam ${env:VAR} para endpoints; o make
      # injeta TEMPO_OTLP_URL / LOKI_OTLP_URL / METRICS_REMOTE_WRITE_URL como
      # valores placeholder via "-e" no "docker run" somente para a etapa de
      # validate. A verificacao estrutural de redacao de PII (grep TX-5) roda
      # ANTES do docker e permanece fail-closed e intacta.
      # ------------------------------------------------------------------
      - name: otel-validate (config TX-5 — redacao PII + otelcol validate)
        run: PLATFORM_STRICT=1 make platform-otel-validate
