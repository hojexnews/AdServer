      # CORRIGIDO (achado M-3, security-reviewer): 'stats' estava AUSENTE
      # desta lista — a asserção abaixo passaria mesmo que
      # db/stats/migrations/0001_stats_schema_down.sql não derrubasse nada.
      # Provado por mutação (1ª mão, fora deste workflow, contra um scratch
      # DB isolado): comentar `DROP SCHEMA IF EXISTS stats CASCADE;` no
      # _down e rodar esta mesma query com 'stats' na lista devolve n=1 e
      # RAISE EXCEPTION — vermelho, como esperado. Sem 'stats' na lista a
      # mesma mutação passava em silêncio.
      - name: confirmar schema vazio apos reversao
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t <<'SQL'
          DO $$
          DECLARE
            n INTEGER;
          BEGIN
            SELECT COUNT(*) INTO n
            FROM information_schema.schemata
            WHERE schema_name IN ('config','ledger','vector_store','compliance','asset_registry','stats');
            IF n > 0 THEN
              RAISE EXCEPTION 'Reversão incompleta: % schema(s) ainda presentes', n;
            END IF;
            RAISE NOTICE 'PASS: todos os schemas removidos corretamente pelo _down.';
          END
          $$;
          SQL
