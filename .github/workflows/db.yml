# db — migrações + isolamento RLS (Fase 1+3, hardening go-live TX-3).
#
# Sobe um Postgres 16 efêmero via service container do GitHub Actions,
# aplica TODAS as migrations (_up) de todos os schemas em ordem obrigatória
# entre schemas: asset_registry → config → ledger → vector → compliance.
# Roda os testes de banco:
#   - rls_isolation_test.sql de config, ledger, vector, compliance (TX-3)
#   - postings_immutability_test.sql (ledger, migration 0004: append-only no
#     banco via trigger — garantia da 28ª onda #6)
# Aplica as migrations _down em ordem inversa e confirma reversão limpa.
# Reporta PASS/FAIL por schema.
#
# DENTRO de cada schema a ordem das migrations NUNCA é enumerada à mão neste
# arquivo: cada step deriva a lista via glob + sort sobre
# db/<schema>/migrations/ — exatamente a mesma convenção de make/db.mk
# (db-test-all): _up = *_up.sql ordenado; _down = *_down.sql em ordem
# reversa. Uma migration nova (ex.: 0005_foo_{up,down}.sql) é aplicada
# automaticamente; nenhum step deste workflow precisa ser editado. Se o
# diretório não tiver nenhum *_up.sql/*_down.sql o step falha explicitamente
# (sentinela anti-vazio) em vez de pular o schema em silêncio.
#
# O primeiro job step (make db-check-schema-list db-check-migration-pairing)
# roda as duas sentinelas de make/db.mk ANTES de qualquer migration: uma
# migration só com _up (ou só com _down) quebraria a reversão lá embaixo;
# um schema novo em db/ sem entrada em DB_SCHEMAS ficaria invisível aos
# steps abaixo. Fonte única com make/db.mk — nada duplicado aqui em YAML.
#
# Tudo sem DATABASE_URL externo: usa o service container de CI.
# Sem credenciais de cloud — completamente offline/efêmero.
#
# Aciona em PR/push quando db/ ou as migrations forem alterados.
# Separado do `verify` rápido pois requer Docker (service container).
name: db (TX-3 RLS isolation)

on:
  pull_request:
    paths:
      - "db/**"
      - "make/db.mk"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "db/**"

permissions:
  contents: read

jobs:
  db-test:
    runs-on: ubuntu-latest

    # Postgres 16 efêmero — sem persistência, sem credenciais externas.
    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres:16 + extensão pgvector. Necessário:
        # a migração db/vector/0001 faz `CREATE EXTENSION vector` e a stock
        # `postgres:16` não a traz → a migração abortava e TODO o gate de RLS
        # (config/ledger/vector/compliance) nunca executava (falso-verde por
        # não-acionamento). Ver db-test-vector / vector_rls_isolation_test.sql.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_only
          POSTGRES_DB: adserver_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adserver_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      # DSN do container de CI — sem segredo real.
      DATABASE_URL: "postgres://postgres:postgres_test_only@localhost:15432/adserver_test?sslmode=disable"

    steps:
      - uses: actions/checkout@v4

      - name: instalar psql (cliente PostgreSQL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      # ------------------------------------------------------------------
      # Sentinelas (make/db.mk): pareamento _up/_down por migration +
      # diretórios reais de db/ vs. DB_SCHEMAS. Fail-fast antes de tocar
      # o Postgres — mesmos alvos que db-test-all roda localmente.
      # ------------------------------------------------------------------
      - name: sentinelas de schema/migration (db-check-schema-list + db-check-migration-pairing)
        run: make db-check-schema-list db-check-migration-pairing

      # ------------------------------------------------------------------
      # Roles de aplicação (adserver_loader BYPASSRLS / adserver_app RLS).
      # Devem existir ANTES das migrations que criam GRANTs.
      # ------------------------------------------------------------------
      - name: criar roles de aplicação
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'adserver_loader') THEN
              CREATE ROLE adserver_loader LOGIN PASSWORD 'loader_dev_only' BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'adserver_app') THEN
              CREATE ROLE adserver_app LOGIN PASSWORD 'app_dev_only';
            END IF;
          END
          $$;
          SQL

      # ------------------------------------------------------------------
      # Migrations _up em ordem obrigatória
      # ------------------------------------------------------------------
      - name: migrations up — asset_registry
        run: |
          dir="db/asset_registry/migrations"
          files=$(ls "$dir"/*_up.sql 2>/dev/null | LC_ALL=C sort)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_up.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  up: asset_registry/$(basename "$f" _up.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations up — config
        run: |
          dir="db/config/migrations"
          files=$(ls "$dir"/*_up.sql 2>/dev/null | LC_ALL=C sort)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_up.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  up: config/$(basename "$f" _up.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations up — ledger
        run: |
          # A ordem/lista vem do diretório (glob + sort), não é enumerada à
          # mão — inclui automaticamente 0004_ledger_postings_immutable
          # (trigger BEFORE UPDATE/DELETE + append-only, garantia da 28a
          # onda #6) e qualquer migration futura, sem editar este step.
          dir="db/ledger/migrations"
          files=$(ls "$dir"/*_up.sql 2>/dev/null | LC_ALL=C sort)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_up.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  up: ledger/$(basename "$f" _up.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations up — vector
        run: |
          dir="db/vector/migrations"
          files=$(ls "$dir"/*_up.sql 2>/dev/null | LC_ALL=C sort)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_up.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  up: vector/$(basename "$f" _up.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations up — compliance
        run: |
          dir="db/compliance/migrations"
          files=$(ls "$dir"/*_up.sql 2>/dev/null | LC_ALL=C sort)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_up.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  up: compliance/$(basename "$f" _up.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # ------------------------------------------------------------------
      # Grants sobre os schemas criados pelas migrations
      # ------------------------------------------------------------------
      - name: grants adserver_loader + adserver_app
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/seed/dev_roles.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q <<'SQL'
          -- ledger
          GRANT USAGE ON SCHEMA ledger TO adserver_loader, adserver_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA ledger TO adserver_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA ledger TO adserver_loader;
          GRANT USAGE ON ALL SEQUENCES IN SCHEMA ledger TO adserver_app;
          GRANT EXECUTE ON FUNCTION ledger.current_tenant_id() TO adserver_app, adserver_loader;
          -- least-privilege complementar (migration 0004, achado HIGH #6 / 28a
          -- onda): adserver_app NAO precisa de UPDATE/DELETE em ledger.postings
          -- (append-only; internal/ledger/posting.go so faz INSERT). O trigger
          -- postings_immutable_trg e a garantia primaria; este REVOKE reduz a
          -- superficie independentemente. O caso 7f de rls_isolation_test.sql
          -- ja aceita insufficient_privilege como rejeicao valida.
          REVOKE UPDATE, DELETE ON ledger.postings FROM adserver_app;
          -- vector_store
          GRANT USAGE ON SCHEMA vector_store TO adserver_loader, adserver_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA vector_store TO adserver_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA vector_store TO adserver_loader;
          -- compliance
          GRANT USAGE ON SCHEMA compliance TO adserver_loader, adserver_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA compliance TO adserver_app;
          GRANT SELECT ON ALL TABLES IN SCHEMA compliance TO adserver_loader;
          SQL

      # ------------------------------------------------------------------
      # Testes de isolamento RLS (TX-3) — um step por schema para
      # PASS/FAIL visível individualmente no GitHub Actions UI.
      # Cada arquivo roda dentro de BEGIN...ROLLBACK — não persiste dados.
      # ------------------------------------------------------------------
      - name: "RLS isolation — config (TX-3)"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
               -f db/config/tests/rls_isolation_test.sql

      - name: "RLS isolation — ledger (TX-3 / DA-11)"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
               -f db/ledger/tests/rls_isolation_test.sql

      # Prova de append-only no BANCO (migration 0004, achado HIGH #6 / 28a onda):
      # INSERT de par balanceado ACEITO; UPDATE/DELETE de posting lancado e
      # UPDATE direto na particao REJEITADOS pelo trigger postings_immutable_trg
      # (mesmo como superusuario); journal_entries imutavel apos posted/void.
      # Roda como o role do DSN de CI (superusuario) de proposito: prova que o
      # BANCO bloqueia a mutacao independentemente de RLS/GRANT.
      - name: "postings append-only immutability (migration 0004 / DA-11)"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
               -f db/ledger/tests/postings_immutability_test.sql

      - name: "RLS isolation — vector (TX-3)"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
               -f db/vector/tests/vector_rls_isolation_test.sql

      - name: "RLS isolation — compliance / KYC (K6 / TX-3)"
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
               -f db/compliance/tests/rls_isolation_test.sql

      # ------------------------------------------------------------------
      # Migrations _down em ordem inversa — confirma reversão limpa
      # ------------------------------------------------------------------
      - name: migrations down — compliance
        run: |
          dir="db/compliance/migrations"
          files=$(ls "$dir"/*_down.sql 2>/dev/null | LC_ALL=C sort -r)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_down.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  down: compliance/$(basename "$f" _down.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations down — vector
        run: |
          dir="db/vector/migrations"
          files=$(ls "$dir"/*_down.sql 2>/dev/null | LC_ALL=C sort -r)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_down.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  down: vector/$(basename "$f" _down.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations down — ledger
        run: |
          # Ordem inversa do _up derivada do diretório (sort -r): a
          # migration mais recente (ex.: imutabilidade) reverte PRIMEIRO.
          dir="db/ledger/migrations"
          files=$(ls "$dir"/*_down.sql 2>/dev/null | LC_ALL=C sort -r)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_down.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  down: ledger/$(basename "$f" _down.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations down — config
        run: |
          dir="db/config/migrations"
          files=$(ls "$dir"/*_down.sql 2>/dev/null | LC_ALL=C sort -r)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_down.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  down: config/$(basename "$f" _down.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: migrations down — asset_registry
        run: |
          dir="db/asset_registry/migrations"
          files=$(ls "$dir"/*_down.sql 2>/dev/null | LC_ALL=C sort -r)
          if [ -z "$files" ]; then
            echo "ERRO: nenhuma migration *_down.sql encontrada em $dir (schema vazio ou mal formado)." >&2
            exit 1
          fi
          for f in $files; do
            echo "  down: asset_registry/$(basename "$f" _down.sql)"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: confirmar schema vazio apos reversao
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -t <<'SQL'
          DO $$
          DECLARE
            n INTEGER;
          BEGIN
            SELECT COUNT(*) INTO n
            FROM information_schema.schemata
            WHERE schema_name IN ('config','ledger','vector_store','compliance','asset_registry');
            IF n > 0 THEN
              RAISE EXCEPTION 'Reversão incompleta: % schema(s) ainda presentes', n;
            END IF;
            RAISE NOTICE 'PASS: todos os schemas removidos corretamente pelo _down.';
          END
          $$;
          SQL
