# ml — testes Python para ML pipeline (J3/J4/J6) e services/copilot (J5).
#
# Jobs:
#   ml-fast      — make ml-test-fast  (OPE + features + promote, ~10 s)
#   ml-full      — make ml-test       (OPE + features + treino + calibracao +
#                  promote — agregado completo, ~30-60 s, so onnxruntime/
#                  onnxmltools Python, SEM PyTorch)
#   ml-batch     — make ml-batch-test (pacing + fraud + unsup, ~30 s)
#   copilot-test — make copilot-test  (suite de seguranca/gateway/HITL do copiloto, ~5 s)
#
# ml-deep fica fora do caminho de PR/push por custo (PyTorch). Acionamento
# manual via workflow_dispatch (botao "Run workflow" no GitHub Actions).
# A job ml-deep-gate roda SOMENTE quando acionada por workflow_dispatch
# (if: github.event_name == 'workflow_dispatch') — nao dispara em PR nem push.
#
# Instalacao de dependencias: setup-python + pip install direto dos
# pyproject.toml/requirements existentes — nao depende do venv commitado.
name: ml

on:
  pull_request:
    paths:
      - "ml/**"
      - "services/copilot/**"
      - "make/ml.mk"
      - "make/ml-batch.mk"
      - "make/copilot.mk"
      - ".github/workflows/ml.yml"
  push:
    branches: [main]
    paths:
      - "ml/**"
      - "services/copilot/**"
      - "make/ml.mk"
      - "make/ml-batch.mk"
      - "make/copilot.mk"
      - ".github/workflows/ml.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do acionamento (ex: pre-K8 gate, release candidate)"
        required: false
        default: "manual"

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # ml-fast: gate rapido de CI (OPE + featurizacao + promote).
  # Nao inclui treino nem deep ranker — sem PyTorch.
  # -----------------------------------------------------------------------
  ml-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar dependencias ML (core)
        run: |
          pip install --quiet \
            numpy \
            pandas \
            scipy \
            scikit-learn \
            lightgbm \
            mlflow-skinny \
            pytest \
            pytest-asyncio \
            pytest-cov

      - name: ml-test-fast (OPE + features + promote)
        run: make ml-test-fast

  # -----------------------------------------------------------------------
  # ml-full: agregado completo `make ml-test` (OPE + features + TREINO +
  # CALIBRACAO + promote). ml-training-test cobre o contrato de artefato
  # ONNX (zipmap=False — G0/E11) e ml-calibration-test cobre ECE/reliability
  # (calibracao isotonica). NAO precisa de PyTorch: so onnxruntime +
  # onnxmltools Python (ja usado pelo export do treino).
  #
  # Backstop obrigatorio: e o UNICO sinal de CI automatizado contra uma
  # regressao silenciosa de ZipMap no ONNX exportado (o parity test Go
  # `-tags onnx` da t.Skip em CI sem libonnxruntime.so nativa).
  # -----------------------------------------------------------------------
  ml-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar dependencias ML (core + treino + calibracao)
        run: |
          pip install --quiet \
            numpy \
            pandas \
            scipy \
            scikit-learn \
            lightgbm \
            mlflow-skinny \
            onnx \
            onnxmltools \
            onnxruntime \
            pytest \
            pytest-asyncio \
            pytest-cov

      # Sentinela contra re-drift do pip install acima (espelha o backstop do
      # job ml-deep-gate): o contrato ZipMap (zipmap=False — G0/E11) e provado
      # por ml/training/test_onnx_export.py, que faz `pytest.importorskip` a
      # nivel de modulo para lightgbm/onnxruntime/onnxmltools. Se qualquer um
      # sair da lista de dependencias acima, o teste de contrato viraria SKIPPED
      # em silencio e o ml-full ficaria verde SEM validar o backstop (este e o
      # UNICO sinal de CI automatizado contra regressao silenciosa de ZipMap).
      # Este passo falha duro e alto, antes de rodar pytest, se faltar qualquer um.
      - name: sentinela lightgbm/onnxruntime/onnxmltools (evita skip silencioso do backstop ZipMap)
        run: |
          python -c "
          import importlib, sys
          faltando = [m for m in ('lightgbm', 'onnxruntime', 'onnxmltools', 'onnx') if importlib.util.find_spec(m) is None]
          if faltando:
              print(f'ERRO: pacote(s) ausente(s) no ambiente de CI: {faltando}.', file=sys.stderr)
              print('ml/training/test_onnx_export.py usa pytest.importorskip para lightgbm/onnxruntime/onnxmltools,', file=sys.stderr)
              print('entao sem eles o teste de contrato ZipMap (zipmap=False, G0/E11) SKIPPARIA em silencio e o', file=sys.stderr)
              print('ml-full ficaria verde SEM validar o backstop. Corrija o pip install acima.', file=sys.stderr)
              sys.exit(1)
          print('sentinela ZipMap: OK — lightgbm/onnxruntime/onnxmltools/onnx presentes.')
          "

      - name: ml-test (OPE + features + treino + calibracao + promote)
        run: |
          set -o pipefail
          make ml-test 2>&1 | tee /tmp/ml-test.log
          # Blindagem pos-hoc (defesa em profundidade, alem da sentinela de
          # import acima — espelha o job ml-deep-gate): falha se QUALQUER teste
          # tiver sido SKIPPED (o backstop ZipMap nunca deve escapar por skip) e
          # confirma explicitamente que o teste de contrato zipmap=False rodou e
          # passou — nunca skipou em silencio.
          if grep -qiE '[0-9]+ skipped' /tmp/ml-test.log; then
            echo "ERRO: make ml-test reportou teste(s) SKIPPED — backstop ZipMap (zipmap=False) mascarado em silencio." >&2
            exit 1
          fi
          if ! grep -q 'test_export_onnx_probabilities_is_flat_tensor_not_zipmap.*PASSED' /tmp/ml-test.log; then
            echo "ERRO: test_export_onnx_probabilities_is_flat_tensor_not_zipmap nao apareceu como PASSED — contrato ZipMap (zipmap=False) NAO foi validado." >&2
            exit 1
          fi
          echo "ml-test: contrato ZipMap (zipmap=False) confirmado PASSED, 0 skipped."

  # -----------------------------------------------------------------------
  # ml-batch: testes de pacing + fraud supervisionado + fraude nao-supervisionada.
  # -----------------------------------------------------------------------
  ml-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar dependencias ML batch (pacing + fraud)
        run: |
          pip install --quiet \
            numpy \
            pandas \
            scipy \
            scikit-learn \
            lightgbm \
            pytest \
            pytest-asyncio \
            pytest-cov

      - name: ml-batch-test (pacing + fraud + unsup)
        run: make ml-batch-test

  # -----------------------------------------------------------------------
  # copilot-test: suite de seguranca/gateway/HITL de services/copilot/ (J5 —
  # HITL, gateway, model-router, schemas, security). Aciona tambem em paths
  # de copilot. NAO hardcodar contagem de testes (a suite cresce a cada onda).
  # -----------------------------------------------------------------------
  copilot-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar adserver-copilot[dev]
        working-directory: services/copilot
        run: pip install --quiet -e ".[dev]"

      - name: copilot-test (J5 — suite de seguranca/gateway/HITL)
        run: PYTHONPATH=. python -m pytest services/copilot/tests/ -v

  # -----------------------------------------------------------------------
  # ml-deep-gate: gate mandatorio pre-K8 com PyTorch + ONNX.
  # SOMENTE workflow_dispatch — nao roda em PR nem push.
  # Acionamento: botao "Run workflow" em Actions > ml > Run workflow.
  # -----------------------------------------------------------------------
  ml-deep-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: instalar dependencias ML deep (PyTorch + ONNX)
        run: |
          pip install --quiet \
            numpy \
            pandas \
            scipy \
            scikit-learn \
            lightgbm \
            pytest \
            pytest-asyncio \
            pytest-cov \
            torch --index-url https://download.pytorch.org/whl/cpu \
            onnx \
            onnxscript \
            onnxruntime

      # Sentinela contra re-drift do pip install acima: os 3 testes
      # TestONNXParity (ml/deep/test_deep.py) usam pytest.importorskip
      # para onnxruntime/onnxscript, entao se algum dia o pacote sair da
      # lista acima, os testes viram SKIPPED em silencio e o job fica
      # verde SEM validar a paridade PyTorch<->ONNX. Este passo falha
      # duro e alto, antes mesmo de rodar pytest, se faltar qualquer um.
      - name: sentinela onnxscript/onnxruntime (evita skip silencioso do TestONNXParity)
        run: |
          python -c "
          import importlib, sys
          faltando = [m for m in ('onnxscript', 'onnxruntime', 'onnxruntime.quantization') if importlib.util.find_spec(m) is None]
          if faltando:
              print(f'ERRO: pacote(s) ausente(s) no ambiente de CI: {faltando}.', file=sys.stderr)
              print('Isso faria TestONNXParity (ml/deep/test_deep.py) SKIPPAR em silencio via pytest.importorskip,', file=sys.stderr)
              print('mascarando o gate de paridade PyTorch<->ONNX pre-K8. Corrija o pip install acima.', file=sys.stderr)
              sys.exit(1)
          print('sentinela onnxscript/onnxruntime: OK — pacotes presentes.')
          "

      - name: ml-deep-test (mandatorio pre-K8)
        run: |
          set -o pipefail
          make ml-deep-test 2>&1 | tee /tmp/ml-deep-test.log
          # Blindagem adicional (defesa em profundidade, alem da sentinela
          # de import acima): falha se QUALQUER teste tiver sido SKIPPED
          # (nao so os de ONNX) e confirma explicitamente que os 3 testes
          # de TestONNXParity rodaram e passaram — nunca skiparam em silencio.
          if grep -qiE '[0-9]+ skipped' /tmp/ml-deep-test.log; then
            echo "ERRO: ml-deep-test reportou teste(s) SKIPPED — gate mascarado em silencio (pre-K8 deve rodar 100% da suite)." >&2
            exit 1
          fi
          for t in test_onnx_float32_parity test_onnx_int8_parity test_onnx_output_in_0_1; do
            if ! grep -q "TestONNXParity::$t PASSED" /tmp/ml-deep-test.log; then
              echo "ERRO: TestONNXParity::$t nao apareceu como PASSED no output — paridade ONNX nao foi validada." >&2
              exit 1
            fi
          done
          echo "ml-deep-test: TestONNXParity (3/3) confirmado PASSED, 0 skipped."
