# kyverno test — baseline ClusterPolicies (supply chain / admissao).
#
# Roda offline com: kyverno test platform/k8s/policy/
#
# Cobre:
#   verify-image-signatures  — imagem nao-ghcr deve ser rejeitada
#   disallow-latest-tag      — :latest deve ser rejeitado; tag explicita aceita;
#                              MESMO se so o initContainer usar :latest (achado
#                              kyverno-baseline-initcontainer-blindspot, 30a onda)
#   require-resource-limits  — pod sem limits rejeitado; com limits aceito;
#                              MESMO se so o initContainer nao tiver limits
#
# NOTA (E8 — nao ha mais placeholder de chave): verify-image-signatures usa
# um attestor "keyless" (Sigstore/Fulcio+Rekor, identidade OIDC do workflow
# .github/workflows/supply-chain.yml) em vez de chave publica estatica.
# Aceitacao real de uma imagem assinada exige rede a Fulcio (emissao do
# certificado efemero) e Rekor (log de transparencia) — nao e testavel
# offline/hermeticamente pelo `kyverno test`. Confirmado empiricamente: rodar
# `kyverno test` aqui contacta o registry (ghcr.io) para buscar a assinatura
# e falha rapido (sem hang) quando a imagem/assinatura nao existe — por isso
# verify-image-signatures continua fora dos `results` abaixo (nunca foi
# testada aqui, mesmo antes do keyless). A aceitacao keyless real so e
# validavel em integracao (cluster vivo com admissao real, E9) ou com fixture
# de assinatura verdadeira via rede (fora do escopo hermetico deste teste).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-baseline-test
policies:
  - kyverno-baseline.yaml
resources:
  - test-resources.yaml
results:
  # --- disallow-latest-tag ---
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - pod-latest-tag
    kind: Pod
    result: fail

  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - pod-versioned-tag
    kind: Pod
    result: pass

  # --- require-resource-limits ---
  - policy: require-resource-limits
    rule: require-limits
    resources:
      - pod-no-limits
    kind: Pod
    result: fail

  - policy: require-resource-limits
    rule: require-limits
    resources:
      - pod-with-limits
    kind: Pod
    result: pass

  # --- kyverno-baseline-initcontainer-blindspot (30a onda): initContainer
  # com :latest e sem limits deve ser rejeitado pelas DUAS policies, mesmo
  # com o container principal 100% conforme — prova de que a REJEICAO
  # cobre spec.initContainers, nao so spec.containers. ---
  - policy: disallow-latest-tag
    rule: require-image-tag
    resources:
      - pod-initcontainer-latest-nolimits
    kind: Pod
    result: fail

  - policy: require-resource-limits
    rule: require-limits
    resources:
      - pod-initcontainer-latest-nolimits
    kind: Pod
    result: fail
