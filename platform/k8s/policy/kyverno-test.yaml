# kyverno test — baseline ClusterPolicies (supply chain / admissao).
#
# Roda offline com: kyverno test platform/k8s/policy/
#
# Cobre:
#   verify-image-signatures  — imagem nao-ghcr deve ser rejeitada
#   disallow-latest-tag      — :latest deve ser rejeitado; tag explicita aceita
#   require-resource-limits  — pod sem limits rejeitado; com limits aceito
#
# NOTA: verifyImages com chave REPLACE_WITH_COSIGN_PUBLIC_KEY nunca aceita
# imagem real sem assinatura valida — o teste verifica apenas a rejeicao de
# imagens fora do registry ghcr.io/hojex/* (pattern que nao bate a regra).
# Aceitacao real de imagem assinada so e testavel com chave real (integracao).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-baseline-test
policies:
  - kyverno-baseline.yaml
resources:
  - test-resources.yaml
results:
  # --- disallow-latest-tag ---
  - policy: disallow-latest-tag
    rule: require-image-tag
    resource: pod-latest-tag
    kind: Pod
    result: fail

  - policy: disallow-latest-tag
    rule: require-image-tag
    resource: pod-versioned-tag
    kind: Pod
    result: pass

  # --- require-resource-limits ---
  - policy: require-resource-limits
    rule: require-limits
    resource: pod-no-limits
    kind: Pod
    result: fail

  - policy: require-resource-limits
    rule: require-limits
    resource: pod-with-limits
    kind: Pod
    result: pass
