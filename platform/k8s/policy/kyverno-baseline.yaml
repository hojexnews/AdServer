# Kyverno — baseline de admissão (supply chain, §2.7, mandato item 4).
#
# Três controles mínimos: (1) imagens assinadas via cosign KEYLESS (OIDC do
# GitHub Actions — Fulcio para o certificado efêmero + Rekor para o log de
# transparência; sem chave estática em disco/git), (2) sem tag :latest,
# (3) limites de recurso obrigatórios. SBOM (anchore/sbom-action, SPDX +
# CycloneDX) + Trivy (fail em CRITICAL) completam a cadeia de CI de imagem
# — ver .github/workflows/supply-chain.yml. Falco cobre o runtime — ver
# platform/observability/falco-rules.yaml. E8 fechou os 4 controles do
# mandato (antes só Kyverno tinha código real).
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Exigir imagens assinadas (cosign keyless)
    policies.kyverno.io/description: >-
      Exige que toda imagem ghcr.io/hojex/* tenha sido assinada com cosign
      KEYLESS pelo workflow supply-chain.yml (identidade OIDC do GitHub
      Actions, verificada via Fulcio + Rekor). Nenhuma chave estática é
      distribuída ou versionada — a identidade do assinante É o workflow.
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/hojex/*"
          attestors:
            - entries:
                # Keyless (Sigstore): sem chave pública para gerenciar/rotacionar.
                # A confiança é ancorada na identidade OIDC do workflow de CI
                # (issuer) + no path exato do workflow (subject) — só builds
                # disparados por tag/release em .github/workflows/supply-chain.yml
                # deste repositório produzem assinatura aceita.
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/hojexnews/AdServer/.github/workflows/supply-chain.yml@refs/tags/*"
                    rekor:
                      url: https://rekor.sigstore.dev
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Proibir tag :latest
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Imagem deve ter tag explícita e versionada (nunca :latest)."
        # spec.containers é obrigatório (âncora simples). spec.initContainers e
        # spec.ephemeralContainers usam a âncora de IGUALDADE "=(chave)": só são
        # validados SE presentes no Pod — um Pod sem initContainers continua
        # passando, mas um initContainer com :latest é rejeitado igual a um
        # container principal (achado `kyverno-baseline-initcontainer-
        # blindspot`, 30ª onda: initContainers rodam ANTES do container
        # principal, muitas vezes com mais privilégio/acesso a volumes
        # compartilhados — vetor real de supply-chain com imagem mutável).
        pattern:
          spec:
            containers:
              - image: "!*:latest"
            =(initContainers):
              - image: "!*:latest"
            =(ephemeralContainers):
              - image: "!*:latest"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Exigir requests/limits
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-limits
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Todo container deve declarar requests e limits de cpu/memória."
        # Mesma âncora de igualdade "=(chave)" do disallow-latest-tag: init/
        # ephemeral containers só são exigidos a ter requests/limits SE
        # existirem no Pod (achado `kyverno-baseline-initcontainer-
        # blindspot`, 30ª onda — initContainer sem limits era um vetor real
        # de exaustão de recursos não coberto). Escopo estrito do fix: só
        # espelha para initContainers/ephemeralContainers o MESMO pattern já
        # existente para containers (não altera o pattern em si).
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
            =(initContainers):
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
            =(ephemeralContainers):
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
