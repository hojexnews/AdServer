# Recursos de teste para kyverno-test.yaml (baseline ClusterPolicies).
# Nao sao aplicados em cluster — usados exclusivamente por `kyverno test`.
---
# pod-latest-tag: deve ser rejeitado por disallow-latest-tag
apiVersion: v1
kind: Pod
metadata:
  name: pod-latest-tag
  namespace: delivery
spec:
  containers:
    - name: app
      image: ghcr.io/hojex/decision:latest
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
---
# pod-versioned-tag: deve passar em disallow-latest-tag e require-resource-limits
apiVersion: v1
kind: Pod
metadata:
  name: pod-versioned-tag
  namespace: delivery
spec:
  containers:
    - name: app
      image: ghcr.io/hojex/decision:v1.2.3
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
---
# pod-no-limits: deve ser rejeitado por require-resource-limits
apiVersion: v1
kind: Pod
metadata:
  name: pod-no-limits
  namespace: delivery
spec:
  containers:
    - name: app
      image: ghcr.io/hojex/decision:v1.2.3
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
---
# pod-with-limits: deve passar em require-resource-limits
apiVersion: v1
kind: Pod
metadata:
  name: pod-with-limits
  namespace: delivery
spec:
  containers:
    - name: app
      image: ghcr.io/hojex/decision:v1.2.3
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
---
# pod-initcontainer-latest-nolimits: initContainer com :latest e sem
# requests/limits — deve ser rejeitado por disallow-latest-tag E por
# require-resource-limits mesmo com o container principal 100% conforme
# (achado kyverno-baseline-initcontainer-blindspot, 30ª onda: initContainers
# rodam ANTES do container principal, frequentemente com mais privilégio
# e acesso a volumes compartilhados — vetor real de supply-chain/exaustão).
apiVersion: v1
kind: Pod
metadata:
  name: pod-initcontainer-latest-nolimits
  namespace: delivery
spec:
  initContainers:
    - name: init-evil
      image: ghcr.io/hojex/decision:latest
  containers:
    - name: app
      image: ghcr.io/hojex/decision:v1.2.3
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
