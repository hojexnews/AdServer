# Argo CD AppProject — fronteira do que a plataforma pode implantar.
#
# Restringe repos de origem, destinos (clusters/namespaces) e tipos de
# recurso. É o limite de blast-radius do GitOps da plataforma.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Plataforma-base do AdServer (infra, rede, observabilidade, segredos).
  sourceRepos:
    # Substituir pela URL real do repositório no apply.
    - "https://github.com/hojex/adserver.git"
  destinations:
    - server: https://kubernetes.default.svc
      namespace: platform-system
    - server: https://kubernetes.default.svc
      namespace: delivery
    - server: https://kubernetes.default.svc
      namespace: ml
    - server: https://kubernetes.default.svc
      namespace: data
    - server: https://kubernetes.default.svc
      namespace: pci
    # aml-kyc: célula AML/KYC/Travel Rule (K6) — namespace canônico.
    # Corrigido de "aml" para "aml-kyc" em alinhamento com
    # platform/cells/aml-kyc/namespace.yaml e platform/k8s/namespaces.yaml.
    - server: https://kubernetes.default.svc
      namespace: aml-kyc
    # db-compliance: namespace do cofre de compliance (PII/KYC pseudônimo).
    # Usado apenas quando o Postgres roda no cluster (Opção A de
    # allow-egress-postgres-compliance.yaml).
    - server: https://kubernetes.default.svc
      namespace: db-compliance
  clusterResourceWhitelist:
    - group: "*"
      kind: Namespace
    - group: cilium.io
      kind: CiliumNetworkPolicy
    - group: kyverno.io
      kind: ClusterPolicy
    # Gateway API — HTTPRoute é namespace-scoped, mas GatewayClass é cluster-scoped.
    - group: gateway.networking.k8s.io
      kind: GatewayClass
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
