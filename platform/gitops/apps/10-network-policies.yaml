# Application filho — Cilium deny-all + allow-dns (TX-3). Prefixo 10 =
# após namespaces. directory.recurse aplica todos os YAMLs de netpol/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: "https://github.com/hojex/adserver.git"
    targetRevision: main
    path: platform/k8s/netpol
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
