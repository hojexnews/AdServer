# RBAC de menor privilegio para a celula PCI (ADR-0004 §F / K4).
#
# Principio: apenas o time de compliance/pagamentos ve o namespace pci.
# SRE geral tem acesso de leitura somente a pods/eventos para debugging.
# Nenhum SA de outros namespaces tem permissao nesta celula.
#
# Roles:
#   pci-viewer: leitura de pods/eventos/servicos (SRE — debugging apenas).
#               NAO ve Secrets (K8s Secrets sao proibidos na celula, mas
#               mesmo assim o RBAC nao concede acesso a recursos secrets).
#   pci-payments-sa: ServiceAccount do workload payments — permissoes
#               minimas para o Pod operar (sem verbos de mutacao de recursos
#               de cluster; apenas leitura de configmaps proprios).
#
# Bindings:
#   pci-viewer-binding: grupo hojex:payments-compliance (substitur OIDC real).
#   Sem binding para SRE geral — a celula PCI e acessivel SOMENTE ao time
#   de compliance/pagamentos por mandato SAQ-A.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pci-viewer
  namespace: pci
  labels:
    adserver.hojex/cell: pci
    adserver.hojex/compliance: pci-saq-a
    adserver.hojex/phase: fase-3-k4
rules:
  # Leitura de recursos operacionais para debugging (sem Secrets).
  - apiGroups: [""]
    resources: [pods, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # ConfigMaps de referencia (ex.: vault-agent-annotations-ref).
  # Nao inclui Secrets — K8s Secrets sao proibidos na celula PCI por policy.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pci-viewer-binding
  namespace: pci
  labels:
    adserver.hojex/cell: pci
    adserver.hojex/compliance: pci-saq-a
    adserver.hojex/phase: fase-3-k4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pci-viewer
subjects:
  # Substituir pelo grupo OIDC real do time de compliance/pagamentos no apply.
  # Nao usar hojex:sre aqui — SRE geral nao tem acesso a celula PCI.
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: hojex:payments-compliance   # PLACEHOLDER: grupo OIDC real
---
# Role minima para o ServiceAccount do workload payments.
# O Pod nao precisa de permissoes de cluster — apenas leitura de seu
# proprio ConfigMap de referencia e nada mais.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pci-payments-workload
  namespace: pci
  labels:
    adserver.hojex/cell: pci
    adserver.hojex/compliance: pci-saq-a
    adserver.hojex/phase: fase-3-k4
rules:
  # Minimo necessario para o Vault Agent Sidecar operar
  # (verificar o proprio pod e ler configmaps de referencia).
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [vault-agent-annotations-ref]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pci-payments-workload-binding
  namespace: pci
  labels:
    adserver.hojex/cell: pci
    adserver.hojex/compliance: pci-saq-a
    adserver.hojex/phase: fase-3-k4
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pci-payments-workload
subjects:
  - kind: ServiceAccount
    name: payments
    namespace: pci
