# OpenBao / Vault Agent — autenticacao Kubernetes e injecao de segredos PCI.
#
# PRINCIPIO: nenhum segredo em claro em git, imagem ou ConfigMap.
# STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET vivem EXCLUSIVAMENTE no
# OpenBao/Vault, path pci/stripe/*. Este arquivo declara COMO o Pod
# obtem esses segredos — nunca os valores.
#
# Mecanismo: Vault Agent Sidecar Injector (anotacoes no Pod/Deployment).
# O Vault Agent autentica via Kubernetes ServiceAccount (Pod Identity),
# busca os segredos no path pci/stripe/* e os escreve como arquivos em
# /vault/secrets/ dentro do Pod.
#
# Path de segredos no OpenBao (policy-pci.hcl referencia):
#   pci/stripe/secret_key         -> STRIPE_SECRET_KEY (sk_live_*)
#   pci/stripe/webhook_secret     -> STRIPE_WEBHOOK_SECRET (whsec_*)
#
# O container payments le:
#   /vault/secrets/stripe-secret-key     (conteudo: sk_live_...)
#   /vault/secrets/stripe-webhook-secret (conteudo: whsec_...)
#
# KMS envelope: o backend KV do OpenBao e configurado com envelope KMS
# (AWS KMS / GCP KMS) para criptografar o storage em repouso. As chaves
# de pagamento seguem o §2.7 / ADR-0004 §F: KMS/HSM para chaves PCI.
#
# Este arquivo define o ServiceAccount do workload payments e as anotacoes
# padrao do Vault Agent Injector para referencia do Deployment.
# O Deployment real vive em services/payments (outro engenheiro); as
# anotacoes abaixo sao o contrato de injecao que o Deployment DEVE usar.
---
# ServiceAccount para o workload payments na celula PCI.
# O OpenBao reconhece esta SA via Kubernetes auth method (role: pci-payments).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments
  namespace: pci
  labels:
    adserver.hojex/cell: pci
    adserver.hojex/compliance: pci-saq-a
    adserver.hojex/phase: fase-3-k4
  annotations:
    adserver.hojex/secrets-path: "pci/stripe/*"
    adserver.hojex/vault-role: "pci-payments"
    # Sem automountServiceAccountToken no nivel de SA — controlado por Pod.
automountServiceAccountToken: false
---
# Referencia de configuracao do Vault Agent Injector.
# ESTE NAO E UM OBJETO KUBERNETES — e um ConfigMap de documentacao que
# registra as anotacoes que o Deployment payments DEVE carregar.
# O security-reviewer e o gate de merge que confirma que o Deployment
# real (services/payments) usa estas anotacoes e nao Kubernetes Secrets.
#
# Anotacoes obrigatorias no Pod spec do Deployment payments:
#
#   vault.hashicorp.com/agent-inject: "true"
#   vault.hashicorp.com/role: "pci-payments"
#   vault.hashicorp.com/agent-inject-secret-stripe-secret-key: "pci/stripe/secret_key"
#   vault.hashicorp.com/agent-inject-template-stripe-secret-key: |
#     {{- with secret "pci/stripe/secret_key" -}}
#     {{ .Data.data.value }}
#     {{- end }}
#   vault.hashicorp.com/agent-inject-secret-stripe-webhook-secret: "pci/stripe/webhook_secret"
#   vault.hashicorp.com/agent-inject-template-stripe-webhook-secret: |
#     {{- with secret "pci/stripe/webhook_secret" -}}
#     {{ .Data.data.value }}
#     {{- end }}
#   vault.hashicorp.com/agent-init-first: "true"
#   vault.hashicorp.com/agent-revoke-on-shutdown: "true"
#   vault.hashicorp.com/agent-pre-populate-only: "false"
#
# O container payments le os segredos de:
#   /vault/secrets/stripe-secret-key
#   /vault/secrets/stripe-webhook-secret
#
# Nunca de env vars estaticas, nunca de K8s Secret, nunca de ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-annotations-ref
  namespace: pci
  labels:
    adserver.hojex/cell: pci
    adserver.hojex/compliance: pci-saq-a
    adserver.hojex/phase: fase-3-k4
    adserver.hojex/type: documentation-only
  annotations:
    adserver.hojex/purpose: >
      Referencia das anotacoes Vault Agent Injector que o Deployment payments
      (services/payments, outro engenheiro) DEVE carregar. Nao contem segredos.
      Gate: security-reviewer valida que o Deployment nao usa K8s Secret estatico.
data:
  vault-role: "pci-payments"
  stripe-secret-key-path: "pci/stripe/secret_key"
  stripe-webhook-secret-path: "pci/stripe/webhook_secret"
  mount-path: "/vault/secrets/"
  kms-envelope: "aws-kms"
  note: >
    STRIPE_SECRET_KEY e STRIPE_WEBHOOK_SECRET NUNCA em git/imagem/ConfigMap com valor.
    Apenas este path. OpenBao policy: policy-pci.hcl (platform/secrets/openbao/).
