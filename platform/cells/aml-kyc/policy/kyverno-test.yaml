# kyverno test — policies especificas da celula AML/KYC (BACEN PLD/FT / LGPD).
#
# Roda offline com: kyverno test platform/cells/aml-kyc/policy/
#
# Cobre:
#   proibir-secret-estatico-aml-kyc   — rejeita Pod com envFrom.secretRef ou
#                                        env.valueFrom.secretKeyRef
#   exigir-vault-agent-aml-kyc        — rejeita Pod sem anotacao vault-agent-inject
#   proibir-label-delivery-em-aml-kyc — rejeita Pod com label cell=delivery
#   proibir-label-pci-em-aml-kyc      — rejeita Pod com label cell=pci
#
# NOTA: em Policy (namespaced, ao contrario de ClusterPolicy), o kyverno CLI
# identifica a policy internamente como "<namespace>/<nome>" — por isso o
# campo "policy:" abaixo usa o prefixo "aml-kyc/". Sem o prefixo, o matching
# falha com "Not found" e o teste inteiro fica silenciosamente quebrado
# (falso-positivo: parecia gate verde, mas nunca executava nada).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-aml-kyc-test
policies:
  - kyverno-aml-kyc.yaml
resources:
  - test-resources.yaml
results:
  # --- proibir-secret-estatico-aml-kyc ---
  - policy: aml-kyc/proibir-secret-estatico-aml-kyc
    rule: proibir-envfrom-secretref
    resources:
      - pod-aml-secret-envfrom
    kind: Pod
    result: fail

  - policy: aml-kyc/proibir-secret-estatico-aml-kyc
    rule: proibir-env-secretkeyref
    resources:
      - pod-aml-secret-envkeyref
    kind: Pod
    result: fail

  - policy: aml-kyc/proibir-secret-estatico-aml-kyc
    rule: proibir-envfrom-secretref
    resources:
      - pod-aml-vault-agent
    kind: Pod
    result: pass

  - policy: aml-kyc/proibir-secret-estatico-aml-kyc
    rule: proibir-env-secretkeyref
    resources:
      - pod-aml-vault-agent
    kind: Pod
    result: pass

  # --- exigir-vault-agent-aml-kyc ---
  - policy: aml-kyc/exigir-vault-agent-aml-kyc
    rule: exigir-vault-agent-inject
    resources:
      - pod-aml-no-vault
    kind: Pod
    result: fail

  - policy: aml-kyc/exigir-vault-agent-aml-kyc
    rule: exigir-vault-agent-inject
    resources:
      - pod-aml-vault-agent
    kind: Pod
    result: pass

  # --- proibir-label-delivery-em-aml-kyc ---
  - policy: aml-kyc/proibir-label-delivery-em-aml-kyc
    rule: proibir-cell-delivery
    resources:
      - pod-aml-label-delivery
    kind: Pod
    result: fail

  - policy: aml-kyc/proibir-label-delivery-em-aml-kyc
    rule: proibir-cell-delivery
    resources:
      - pod-aml-vault-agent
    kind: Pod
    result: pass

  # --- proibir-label-pci-em-aml-kyc ---
  - policy: aml-kyc/proibir-label-pci-em-aml-kyc
    rule: proibir-cell-pci
    resources:
      - pod-aml-label-pci
    kind: Pod
    result: fail

  - policy: aml-kyc/proibir-label-pci-em-aml-kyc
    rule: proibir-cell-pci
    resources:
      - pod-aml-vault-agent
    kind: Pod
    result: pass
