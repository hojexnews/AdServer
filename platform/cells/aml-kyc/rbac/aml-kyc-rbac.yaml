# RBAC de menor privilegio para a celula AML/KYC (ADR-0004 §F / K6).
#
# Principio: apenas o time de compliance/pagamentos acessa o namespace aml-kyc.
# SRE geral tem acesso de leitura somente a pods/eventos para debugging operacional.
# Nenhum SA de outros namespaces (delivery, ml, data, pci) tem permissao nesta celula.
#
# Roles definidas:
#
#   aml-kyc-viewer:
#     Leitura de pods, services, endpoints e eventos para debugging por SRE de compliance.
#     NAO ve Secrets (K8s Secrets sao proibidos na celula por Kyverno; mesmo assim
#     o RBAC nao concede acesso a recursos secrets como camada extra de defesa).
#     Restrita ao grupo hojex:payments-compliance (PLACEHOLDER — substituir pelo
#     grupo OIDC real do provedor de identidade no apply).
#
#   aml-kyc-payments-workload:
#     Role minima para o ServiceAccount payments (workload da celula).
#     Apenas leitura do proprio ConfigMap de referencia do Vault Agent.
#     Sem verbos de mutacao de recursos de cluster.
#
# Ausencia de binding para SRE geral:
#   A celula AML/KYC contem PII/KYC pseudonimo e chaves de custódia. O acesso
#   humano e restrito ao time de compliance/pagamentos. SRE geral NAO tem binding
#   aqui — qualquer necessidade operacional deve ser escalada via processo de acesso
#   temporario (break-glass) com aprovacao do compliance officer.
#
# Conformidade: LGPD art.46 (medidas tecnicas e administrativas de seguranca),
# BACEN Resolucao 4.658 (seguranca da informacao), TX-3 (PII isolada),
# principio de menor privilegio (zero-trust).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aml-kyc-viewer
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
rules:
  # Leitura de recursos operacionais para debugging (sem Secrets).
  - apiGroups: [""]
    resources: [pods, services, endpoints, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # ConfigMaps de referencia (ex.: vault-agent-annotations-ref).
  # Nao inclui Secrets — K8s Secrets sao proibidos na celula por Kyverno.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aml-kyc-viewer-binding
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aml-kyc-viewer
subjects:
  # Substituir pelo grupo OIDC real do time de compliance/pagamentos no apply.
  # Nao usar hojex:sre aqui — SRE geral nao tem acesso a celula AML/KYC por mandato
  # de privacidade (PII/KYC presente na celula).
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: hojex:payments-compliance   # PLACEHOLDER: grupo OIDC real
---
# Role minima para o ServiceAccount do workload payments.
# O Pod nao precisa de permissoes de cluster — apenas leitura do proprio
# ConfigMap de referencia do Vault Agent.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aml-kyc-payments-workload
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
rules:
  # Minimo necessario para o Vault Agent Sidecar operar
  # (verificar o proprio pod e ler configmaps de referencia).
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [vault-agent-annotations-ref]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aml-kyc-payments-workload-binding
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aml-kyc-payments-workload
subjects:
  - kind: ServiceAccount
    name: payments
    namespace: aml-kyc
