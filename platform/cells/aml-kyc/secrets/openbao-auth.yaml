# OpenBao / Vault Agent — contrato de autenticacao e segredos para a celula AML/KYC
# (ADR-0004 §F / §E.10 / K6).
#
# NENHUM VALOR DE SEGREDO NESTE ARQUIVO. Apenas:
#   - ServiceAccount do workload payments (identidade para K8s Auth Method).
#   - ConfigMap de referencia (anotacoes do Vault Agent — paths OpenBao, roles).
#   - Documentacao dos segredos gerenciados e seus paths no OpenBao.
#
# Como o Vault Agent obtem os segredos:
#   1. O Pod payments inicia com o Vault Agent como sidecar init container.
#   2. O Vault Agent apresenta o JWT do ServiceAccount ao OpenBao server
#      (metodo de auth: kubernetes; role: aml-kyc-payments).
#   3. O OpenBao valida o JWT contra a API Kubernetes do cluster.
#   4. O OpenBao emite um token com as policies: policy-aml-kyc.hcl.
#   5. O Vault Agent le os segredos e os escreve em /vault/secrets/ no Pod.
#   6. O container payments le do filesystem — nunca de env estatica ou K8s Secret.
#   7. O Vault Agent renova leases automaticamente (segredos dinamicos:
#      DB_COMPLIANCE_DSN tem lease renovavel pelo database secrets engine).
#
# Segredos gerenciados nesta celula (paths OpenBao — sem valores):
#
#   SUMSUB_API_KEY:
#     path:   aml-kyc/sumsub/api_key
#     tipo:   KV v2 (estatico, rotacao manual ou automatica)
#     uso:    autenticacao na API Sumsub (header X-App-Token nos requests)
#
#   SUMSUB_WEBHOOK_SECRET:
#     path:   aml-kyc/sumsub/webhook_secret
#     tipo:   KV v2 (estatico, rotacao coordenada com Sumsub dashboard)
#     uso:    validacao HMAC-SHA256 dos callbacks do Sumsub
#
#   CHAINALYSIS_API_KEY:
#     path:   aml-kyc/chainalysis/api_key
#     tipo:   KV v2 (estatico, rotacao manual ou automatica)
#     uso:    autenticacao na API Chainalysis KYT (header x-api-key)
#
#   SAFE_OWNER_KEY (chave de custódia Safe multisig — K5):
#     path:   aml-kyc/custody/safe_owner_key
#     tipo:   KV v2 + envelope KMS (AWS KMS / GCP KMS / HSM)
#     uso:    chave privada do owner Safe multisig para assinar transacoes
#     nota:   chave de pagamento — EXIGE envelope KMS/HSM conforme §2.7.
#             A chave nunca e exportada em claro; o KMS faz a assinatura
#             em hardware (FIPS 140-2 Level 3 para HSM) quando disponivel.
#
#   SAFE_RPC_URL:
#     path:   aml-kyc/custody/safe_rpc_url
#     tipo:   KV v2 (endpoint RPC da chain EVM; nao e segredo por si,
#             mas tratado como segredo para evitar SSRF / endpoint swap)
#     uso:    URL do no RPC EVM para o ChainConnector (ex.: Alchemy/Infura)
#
#   DB_COMPLIANCE_DSN (dynamic secret — lease renovavel):
#     path:   aml-kyc/db/compliance (database secrets engine)
#     tipo:   dynamic secret (usuario/senha gerados por lease, TTL curto)
#     uso:    conexao ao Postgres do cofre de compliance (db/compliance)
#     nota:   o Vault Agent renova o lease antes do TTL expirar.
#             Em rotacao, o OpenBao cria novo usuario antes de revogar o anterior.
#
# Envelope KMS para PII em repouso:
#   O Postgres do cofre de compliance usa criptografia de camada de armazenamento
#   com envelope KMS (chave de dados cifrada por KMS). O OpenBao KV backend
#   tambem usa envelope KMS para os segredos de custódia (SAFE_OWNER_KEY).
#   Referencia: ADR-0004 §F ("KMS/HSM para chaves de pagamento").
#   Nenhuma chave KMS e armazenada neste arquivo — gerenciada pelo provedor
#   de cloud (AWS KMS / GCP KMS) e referenciada pela configuracao do OpenBao.
#
# policy-aml-kyc.hcl (platform/secrets/openbao/):
#   path "aml-kyc/*"  { capabilities = ["read"] }
#   Leitura restrita a aml-kyc/* — sem acesso a pci/*, outros namespaces.
#   O auditor de privacidade valida a policy antes do go-live.
---
# ServiceAccount do workload payments na celula AML/KYC.
# Usada pelo OpenBao Kubernetes Auth Method para validar a identidade do Pod.
# Nenhum valor de segredo aqui.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
    adserver.hojex/owner: platform-infra-engineer
  annotations:
    # Anotacao informativa: esta SA e mapeada ao role aml-kyc-payments
    # no OpenBao via Kubernetes Auth Method. O bind e feito na configuracao
    # do OpenBao (platform/secrets/openbao/), nao aqui.
    adserver.hojex/openbao-role: "aml-kyc-payments"
    adserver.hojex/openbao-policies: "policy-aml-kyc"
    adserver.hojex/secrets-path: "aml-kyc/*"
---
# ConfigMap de referencia para as anotacoes do Vault Agent Sidecar.
# NAO contem valores de segredo. Documenta o contrato de injeccao.
# O Deployment real (services/payments) usa estas anotacoes no Pod template.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-annotations-ref
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
    adserver.hojex/owner: platform-infra-engineer
  annotations:
    adserver.hojex/purpose: >
      Documentacao de referencia das anotacoes do Vault Agent para o
      Deployment payments. NAO e lido em runtime pelo Pod — e referencia
      para o engenheiro de services/payments ao escrever o Pod template.
data:
  # Anotacoes a incluir no Pod template do Deployment payments:
  # (copiar para metadata.annotations do PodSpec)
  pod-annotations-reference: |
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "aml-kyc-payments"
    vault.hashicorp.com/agent-inject-secret-sumsub-api-key: "aml-kyc/sumsub/api_key"
    vault.hashicorp.com/agent-inject-secret-sumsub-webhook-secret: "aml-kyc/sumsub/webhook_secret"
    vault.hashicorp.com/agent-inject-secret-chainalysis-api-key: "aml-kyc/chainalysis/api_key"
    vault.hashicorp.com/agent-inject-secret-safe-owner-key: "aml-kyc/custody/safe_owner_key"
    vault.hashicorp.com/agent-inject-secret-safe-rpc-url: "aml-kyc/custody/safe_rpc_url"
    vault.hashicorp.com/agent-inject-secret-db-compliance-dsn: "aml-kyc/db/compliance"
