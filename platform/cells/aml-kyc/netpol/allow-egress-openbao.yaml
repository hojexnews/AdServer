# Egress do servico payments para o OpenBao/Vault Agent na celula AML/KYC
# (ADR-0004 §F / K6).
#
# O Vault Agent (sidecar) roda no mesmo Pod que o container payments e
# busca segredos do OpenBao via loopback (127.0.0.1) na maioria dos casos.
# Esta policy cobre:
#
#   a) Renovacao de token de autenticacao Kubernetes Auth Method:
#      o Vault Agent apresenta o ServiceAccount token ao OpenBao server
#      para renovar o token de vault. Essa chamada vai ao OpenBao server
#      no namespace platform-system (nao via loopback).
#
#   b) Revogacao de lease de segredos dinamicos (ex.: dynamic secret do
#      cofre de compliance — conexao ao Postgres db/compliance):
#      o Vault Agent renova e, se necessario, revoga leases dinamicos
#      diretamente no OpenBao server.
#
# Segredos injetados via Vault Agent (arquivo em /vault/secrets/):
#   - SUMSUB_API_KEY           (path OpenBao: aml-kyc/sumsub/api_key)
#   - SUMSUB_WEBHOOK_SECRET    (path OpenBao: aml-kyc/sumsub/webhook_secret)
#   - CHAINALYSIS_API_KEY      (path OpenBao: aml-kyc/chainalysis/api_key)
#   - SAFE_OWNER_KEY           (path OpenBao: aml-kyc/custody/safe_owner_key)
#   - SAFE_RPC_URL             (path OpenBao: aml-kyc/custody/safe_rpc_url)
#   - DB_COMPLIANCE_DSN        (dynamic secret: aml-kyc/db/compliance — lease renovavel)
#
# Porta 8200: porta padrao do OpenBao/Vault (API HTTP/HTTPS).
# Porta 8201: porta de cluster do OpenBao (replication/HA) — incluida
#             para topologias HA sem necessidade de nova policy.
#
# O container payments le segredos do filesystem (/vault/secrets/) —
# nunca de variaveis de ambiente estaticas nem de Kubernetes Secrets.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-openbao
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
    adserver.hojex/owner: platform-infra-engineer
    adserver.hojex/audit: privacy-compliance-validavel
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: payments
      adserver.hojex/cell: aml-kyc

  egress:
    # Egress para OpenBao server no namespace platform-system.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: platform-system
            app.kubernetes.io/name: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
            - port: "8201"
              protocol: TCP
