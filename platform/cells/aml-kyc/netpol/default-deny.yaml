# Cilium default-deny para a celula AML/KYC (ADR-0004 §F).
#
# Nenhum trafego entra ou sai do namespace aml-kyc sem policy de allow
# explicita. DNS liberado em allow-dns.yaml.
#
# Trafego bloqueado por default (exemplos que NUNCA devem entrar
# sem policy explicita aprovada por security-reviewer):
#   - delivery (hot path) -> aml-kyc: BLOQUEADO — cripto fora do hot path.
#   - aml-kyc -> delivery: BLOQUEADO — pagamento nunca influencia decisao.
#   - aml-kyc -> internet sem policy: BLOQUEADO — egress de API externa
#     (Sumsub, Chainalysis) requer policy com FQDN explicitico.
#
# O motor de decisao (delivery) consulta apenas budgets pre-computados
# (pacing DA-4) — nunca chama aml-kyc em tempo de decisao.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k0
spec:
  endpointSelector: {}
  ingress: []
  egress: []
