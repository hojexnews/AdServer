# Egress allowlist Travel Rule para a celula AML/KYC (ADR-0004 §E.10 / §F / K6).
#
# O Travel Rule (GAFI/FATF R.16) exige que VASPs troquem informacoes de
# originador e beneficiario em transferencias cripto acima do limiar
# (USD 1.000 / EUR 1.000, ou menor conforme jurisdicao BACEN). O protocolo
# de Travel Rule (TRISA, OpenVASP ou IVMS 101) conecta VASPs via API.
#
# PLACEHOLDER — FQDN do provedor de Travel Rule:
#   O endpoint concreto depende do provedor escolhido:
#
#   Opcao A (TRISA): api.trisa.io:443 — rede global VASP; protocolo gRPC/TLS
#   Opcao B (OpenVASP): nao tem endpoint centralizado (P2P); pode nao exigir
#     esta regra (mensagens diretas VASP-a-VASP via DNS de chave publica).
#   Opcao C (Notabene / Sygna Bridge / Veriscope): endpoints proprios (ex.:
#     api.notabene.id:443 ou api.sygnabridge.com:443).
#
#   Acao pre-go-live: substituir "travel-rule-provider.example.com" pelo
#   FQDN real do provedor contratado. O security-reviewer deve aprovar o
#   FQDN e o auditor de privacidade deve validar que nenhum PII e exportado
#   sem conformidade Travel Rule (conteudo da mensagem e criptografado
#   ponta-a-ponta pelo protocolo IVMS 101 / TRISA).
#
# Destinos NAO liberados enquanto PLACEHOLDER:
#   - O FQDN placeholder abaixo NAO resolve em producao e gera negacao
#     de DNS — nao ha vazamento de dados enquanto o PLACEHOLDER estiver ativo.
#   - A regra so torna-se efetiva apos substituicao pelo FQDN real.
#
# Nota de privacidade (TX-3/DA-11):
#   As mensagens de Travel Rule conteem PII do originador/beneficiario
#   (nome, endereco). Esse PII e criptografado ponta-a-ponta pelo protocolo
#   IVMS 101 e nunca transita em claro pela rede interna. A celula AML/KYC
#   e a UNICA fronteira onde esse PII e processado e armazenado (cofre
#   compliance). Ledger e telemetria NAO recebem esse PII.
#
# endpointSelector: aplica-se apenas ao workload payments.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-travel-rule
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
    adserver.hojex/owner: platform-infra-engineer
    adserver.hojex/audit: privacy-compliance-validavel
  annotations:
    adserver.hojex/placeholder: >
      FQDN "travel-rule-provider.example.com" e PLACEHOLDER.
      Substituir pelo FQDN real do provedor (TRISA / Notabene / Sygna Bridge
      / Veriscope) antes do go-live. Aprovacao: security-reviewer +
      privacy-compliance-auditor.
spec:
  # Aplica somente ao workload payments dentro da celula AML/KYC.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: payments
      adserver.hojex/cell: aml-kyc

  egress:
    # --- Travel Rule provider:443 — PLACEHOLDER (ver anotacao acima) --------
    # Substituir matchName pelo FQDN real antes do go-live.
    - toFQDNs:
        - matchName: "travel-rule-provider.example.com"  # PLACEHOLDER
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
