# Egress de DNS para a celula AML/KYC.
#
# Libera apenas UDP/TCP 53 para kube-dns. Necessario para resolucao de
# nomes de API externas (sumsub.com, chainalysis.com, api.asaas.com).
# Aberturas de egress para FQDNs externos sao policies separadas,
# auditadas por security-reviewer.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k0
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
