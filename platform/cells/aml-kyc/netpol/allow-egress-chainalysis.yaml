# Egress allowlist Chainalysis (screening on-chain) para a celula AML/KYC
# (ADR-0004 §E.10 / §F / K6).
#
# Destinos liberados — minimo para o pipeline de screening on-chain:
#
#   1. api.chainalysis.com:443
#      Motivo: API REST do Chainalysis (Know Your Transaction / KYT) para
#      screening de enderecos e transacoes on-chain antes de processar
#      depositos/pagamentos cripto (USDC, AEV, BND quando habilitado).
#      Inclui consulta de risco de carteira e screening de sancoes
#      (OFAC, EU, BACEN lista PLD/FT) — exigido pelo Travel Rule e
#      regulacao BACEN/MiCA para ativos cripto (§E.3/§E.10).
#
#   2. data.chainalysis.com:443
#      Motivo: endpoint de dados do Chainalysis para download de feeds
#      de sancoes e atualizacao de listas de risco. Necessario para
#      o pipeline de compliance manter as listas atualizadas sem depender
#      exclusivamente de chamadas transacionais (latencia de screening).
#      PLACEHOLDER: confirmar se este subdominio e correto para o plano
#      contratado — pode ser apenas api.chainalysis.com com path distinto.
#      Auditor: rever contra contrato Chainalysis antes do go-live.
#
# Destinos NAO liberados (justificativa para auditor):
#   - Qualquer outro FQDN da internet: BLOQUEADO.
#   - Namespaces delivery, ml, data, pci: BLOQUEADO (deny-all base).
#   - O hot path de decisao (delivery) nunca chama a celula AML/KYC.
#
# Implementacao: CiliumNetworkPolicy com toFQDNs — requer Cilium DNS proxy
# ativo (--enable-l7-proxy=true). O DNS e resolvido em allow-dns.yaml (K0).
#
# endpointSelector: aplica-se apenas ao workload payments (label
# app.kubernetes.io/name: payments, adserver.hojex/cell: aml-kyc).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-egress-chainalysis
  namespace: aml-kyc
  labels:
    adserver.hojex/cell: aml-kyc
    adserver.hojex/compliance: aml-kyc-travel-rule
    adserver.hojex/phase: fase-3-k6
    adserver.hojex/owner: platform-infra-engineer
    adserver.hojex/audit: privacy-compliance-validavel
spec:
  # Aplica somente ao workload payments dentro da celula AML/KYC.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: payments
      adserver.hojex/cell: aml-kyc

  egress:
    # --- 1. api.chainalysis.com:443 (KYT screening + sancoes) ---------------
    - toFQDNs:
        - matchName: "api.chainalysis.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # --- 2. data.chainalysis.com:443 (feeds de sancoes — ver nota PLACEHOLDER)
    - toFQDNs:
        - matchName: "data.chainalysis.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
