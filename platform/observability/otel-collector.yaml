# OpenTelemetry Collector — redação de PII na borda (TX-5).
#
# Gate de privacidade da Fase 0: NENHUM dado pessoal sai do collector.
# O IP bruto é DESCARTADO após derivar geo; chaves de capping são
# hasheadas; atributos reidentificáveis são removidos ANTES de qualquer
# export (TX-5/DA-11). Observabilidade do copiloto (Langfuse) é
# self-hosted; este collector é o ponto de redação DESTINADO a
# traces/metrics/logs de infra+app assim que forem cabeados (ver ressalva
# sinal-por-sinal abaixo: nenhum dos três está vigente hoje).
#
# COBERTURA: os TRÊS pipelines de sinal (traces, metrics, logs) passam
# pela mesma dupla de barreiras — transform/redact-pii (remoção por chave
# conhecida) seguido do redaction/allowlist-<tipo> específico do tipo de
# sinal (fail-closed: só o que está na allowlist sobrevive). O gate
# `make platform-otel-validate` (via
# platform/observability/otel-pipeline-redaction-check.py) enumera TODOS
# os pipelines definidos em service.pipelines — não uma lista hardcoded —
# e reprova por construção qualquer pipeline (deste ou de qualquer nome,
# incluindo `<tipo>/<id>` como `traces/raw`) que não tenha as duas
# barreiras cabeadas em .processors (achados `otel-gate-hardcoded-
# pipeline-names` e `otel-metrics-pipeline-sem-redacao-e-sem-gate`, 30ª
# onda de auditoria adversarial).
#
# RESSALVA HONESTA — SINAL POR SINAL (achados
# `otel-redacao-orfa-do-caminho-real-de-logs`, 30ª onda, e
# `otel-doc-lie-traces-metrics-vigentes`, 31ª onda de remediação): esta
# config valida ESTRUTURALMENTE a redação para os três tipos de sinal, mas
# "estrutural" não é o mesmo que "vigente" — vigente exige um emissor real
# no código apontando para este collector. Reverificado de 1ª mão (grep por
# OTLPLogExporter/LoggerProvider/OTLPSpanExporter/OTLPMetricExporter/
# TracerProvider/MeterProvider/otlptrace/otlpmetric/sdktrace/OTEL_EXPORTER_
# OTLP em services/, internal/, bff/src, web/console/src e go.mod; e por
# opentelemetry.metrics.get_meter sem nenhum set_meter_provider/
# set_tracer_provider em services/copilot):
#
#   - LOGS: NÃO vigente. Nenhum serviço exporta logs via OTLP; structlog/
#     slog escrevem em stdout; o collector não tem receiver `filelog`.
#   - TRACES: NÃO vigente. Nenhum serviço instancia um TracerProvider OTLP
#     nem chama um exporter otlptrace/otlphttp. `services/copilot/
#     pyproject.toml` declara `opentelemetry-api/-sdk/-exporter-otlp` como
#     dependência, mas nada no código chama `set_tracer_provider` — a
#     dependência está listada, não cabeada.
#   - METRICS: NÃO vigente. `services/copilot/observability/
#     langfuse_setup.py::record_otel_usage` chama
#     `opentelemetry.metrics.get_meter(...)` mas nunca instala um
#     MeterProvider com um OTLPMetricExporter — sem um provider configurado
#     a API do OTel usa o meter no-op global por padrão, então
#     `counter.add(...)` não emite nada para lugar nenhum, muito menos
#     para este collector.
#
# Ou seja: para os TRÊS sinais, a redação aqui é uma barreira ESTRUTURAL
# PRONTA (o gate `make platform-otel-validate` garante que, no dia em que
# um sinal passar a ser emitido de fato, ele já nasce redigido), não uma
# garantia HOJE VIGENTE sobre nenhum dos três. Não existe hoje nenhum
# caminho real de app -> collector para traces, metrics ou logs. Cabear
# os serviços (TracerProvider/MeterProvider com exporter OTLP apontando
# para este collector, e um receiver `filelog` ou emissor de log OTLP para
# logs) é trabalho pendente para os três — nenhum dos três deve ser lido
# como "já protegido em produção" só porque esta config existe.
#
# Validação estrutural: é YAML bem-formado; a validação semântica completa
# (`otelcol validate --config`) roda no CI de imagem do collector (Fase 1),
# pois depende da distro/componentes empacotados.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # 1) Proteção do próprio collector contra pressão de memória.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

  # 2) REDAÇÃO DE PII (TX-5). Remove atributos que carregam ou derivam
  #    identidade. O IP bruto nunca deve chegar até aqui (descartado no
  #    serviço após derivar geo); esta é a barreira em profundidade.
  #    Cobre os três contextos (span, datapoint, log) — nenhum tipo de
  #    sinal fica de fora (achado `otel-metrics-pipeline-sem-redacao-e-
  #    sem-gate`, 30ª onda: o contexto `datapoint` estava ausente).
  transform/redact-pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # IP do cliente em qualquer convenção semântica — DELETAR.
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "http.client_ip")
          - delete_key(attributes, "net.sock.peer.addr")
          - delete_key(attributes, "net.peer.ip")
          - delete_key(attributes, "url.full")        # pode conter querystring com PII
          # Identificadores diretos de pessoa — DELETAR.
          - delete_key(attributes, "enduser.id")
          - delete_key(attributes, "user.id")
          - delete_key(attributes, "user.email")
          # Chave de capping: efêmera e hasheada (TX-5). Se aparecer, hashear.
          - set(attributes["capping.key"], SHA256(attributes["capping.key"])) where attributes["capping.key"] != nil
    metric_statements:
      - context: datapoint
        statements:
          # Mesma barreira de traces/logs, aplicada aos atributos do
          # datapoint — o exporter prometheusremotewrite promove esses
          # atributos a LABELS exportados, então eles precisam da mesma
          # redação (achado `otel-metrics-pipeline-sem-redacao-e-sem-
          # gate`, 30ª onda).
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "http.client_ip")
          - delete_key(attributes, "net.sock.peer.addr")
          - delete_key(attributes, "net.peer.ip")
          - delete_key(attributes, "url.full")        # pode conter querystring com PII
          - delete_key(attributes, "enduser.id")
          - delete_key(attributes, "user.id")
          - delete_key(attributes, "user.email")
          - set(attributes["capping.key"], SHA256(attributes["capping.key"])) where attributes["capping.key"] != nil
    log_statements:
      - context: log
        statements:
          # IP do cliente em qualquer convenção semântica — DELETAR.
          - delete_key(attributes, "client.address")
          - delete_key(attributes, "http.client_ip")
          - delete_key(attributes, "net.sock.peer.addr")
          - delete_key(attributes, "net.peer.ip")
          - delete_key(attributes, "url.full")        # pode conter querystring com PII
          # Identificadores diretos de pessoa — DELETAR.
          - delete_key(attributes, "enduser.id")
          - delete_key(attributes, "user.id")
          - delete_key(attributes, "user.email")
          # Chave de capping: efêmera e hasheada (TX-5). Se aparecer, hashear.
          - set(attributes["capping.key"], SHA256(attributes["capping.key"])) where attributes["capping.key"] != nil

  # 3a) Allow-list final para TRACES: só os atributos abaixo SOBREVIVEM em
  #     spans. Qualquer chave nova/inesperada é bloqueada por padrão
  #     (fail-closed de privacidade).
  redaction/allowlist-traces:
    allow_all_keys: false
    allowed_keys:
      - service.name
      - service.namespace
      - tenant_id          # pseudônimo (TX-3) — nunca PII
      - decision_id
      - model_version
      - zone_id
      - site_id
      - served_tier
      - geo.country        # derivado, mínimo (sem coordenadas)
      - geo.city
      - http.request.method
      - http.response.status_code
      - otel.status_code
    # Mascara valores que casem padrões sensíveis, caso passem como valor.
    blocked_values:
      - "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b"               # IPv4
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}" # e-mail
    summary: debug

  # 3b) Allow-list final para LOGS: mesma postura fail-closed dos traces.
  #     Qualquer chave de log não listada aqui é silenciada antes do export.
  #     A allowlist é deliberadamente mais restrita que a de traces (logs têm
  #     body livre; atributos devem ser somente metadados estruturais).
  #
  #     Chaves permitidas e justificativa de não-PII:
  #       service.name / service.namespace — identidade do serviço (não de pessoa)
  #       severity_text / severity_number  — nível de severidade, sem identidade
  #       tenant_id     — pseudônimo opaco (TX-3), nunca ligado a pessoa natural
  #       decision_id   — UUID de decisão de ad-serving, sem ligação a indivíduo
  #       zone_id / site_id / served_tier / model_version — inventário e ML, sem PII
  #       geo.country   — granularidade de país (derivado de IP já descartado)
  #       http.request.method / http.response.status_code — métricas de protocolo
  #       error.type / exception.type — categorias de erro, sem payload de dados
  #       code.function / code.namespace — localização do log no código-fonte
  #       otel.status_code — código de status interno do OTel
  #       log.file.name  — nome do arquivo de origem do log, sem PII
  redaction/allowlist-logs:
    allow_all_keys: false
    allowed_keys:
      - service.name
      - service.namespace
      - severity_text
      - severity_number
      - tenant_id
      - decision_id
      - zone_id
      - site_id
      - served_tier
      - model_version
      - geo.country
      - http.request.method
      - http.response.status_code
      - error.type
      - exception.type
      - code.function
      - code.namespace
      - otel.status_code
      - log.file.name
    # Mesmos bloqueios de valor sensível dos traces (defense-in-depth).
    blocked_values:
      - "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b"               # IPv4
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}" # e-mail
    summary: debug

  # 3c) Allow-list final para METRICS: o exporter prometheusremotewrite
  #     promove atributos de DATAPOINT a LABELS remote-write — mesma
  #     postura fail-closed de traces/logs, restrita a dimensões de
  #     agregação (achado `otel-metrics-pipeline-sem-redacao-e-sem-gate`,
  #     30ª onda: até aqui o pipeline metrics não tinha allowlist alguma).
  #
  #     Chaves permitidas e justificativa de não-PII: mesmo racional da
  #     allowlist de logs — nenhuma delas identifica pessoa natural.
  redaction/allowlist-metrics:
    allow_all_keys: false
    allowed_keys:
      - service.name
      - service.namespace
      - tenant_id
      - zone_id
      - site_id
      - served_tier
      - model_version
      - geo.country
      - http.request.method
      - http.response.status_code
      - otel.status_code
    # Mesmos bloqueios de valor sensível dos demais pipelines.
    blocked_values:
      - "\\b\\d{1,3}(\\.\\d{1,3}){3}\\b"               # IPv4
      - "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}" # e-mail
    summary: debug

  # 4) Lote para eficiência de export.
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  # Métricas → VictoriaMetrics/Mimir (remote write). Endpoint por env.
  prometheusremotewrite:
    endpoint: ${env:METRICS_REMOTE_WRITE_URL}
  # Traces → Tempo (OTLP/HTTP).
  otlphttp/tempo:
    endpoint: ${env:TEMPO_OTLP_URL}
  # Logs → Loki (via OTLP/HTTP).
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_URL}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact-pii, redaction/allowlist-traces, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      # transform/redact-pii primeiro (remoção por chave conhecida nos
      # atributos do datapoint), redaction/allowlist-metrics depois
      # (fail-closed: só a allowlist sobrevive antes do remote-write).
      processors: [memory_limiter, transform/redact-pii, redaction/allowlist-metrics, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      # transform/redact-pii primeiro: elimina por chave conhecida (rápido).
      # redaction/allowlist-logs depois: falha-fechado — qualquer chave
      # residual não listada é descartada antes do export para Loki (TX-5).
      processors: [memory_limiter, transform/redact-pii, redaction/allowlist-logs, batch]
      exporters: [otlphttp/loki]
  telemetry:
    metrics:
      level: detailed
