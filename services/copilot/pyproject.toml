[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "adserver-copilot"
version = "0.1.0"
description = "Copiloto LangGraph para o AdServer — gateway Python com HITL obrigatório (J5/Fase 2)"
requires-python = ">=3.12"
dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-core>=0.3.0",

    # Anthropic SDK (modelo Claude)
    "anthropic>=0.34.0",

    # Pydantic v2 — validação tipada de ferramentas (TX-3)
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # HTTP / ASGI — FastAPI para os endpoints SSE + HITL
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",

    # Postgres / pgvector — RAG escopado (TX-3/RLS)
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",

    # Observabilidade — Langfuse self-hosted (TX-5)
    "langfuse>=2.52.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",

    # Utilitários
    "structlog>=24.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "tools*", "guardrails*", "graph*", "rag*", "observability*"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A"]
ignore = [
    "S101",   # assert usados em testes
    "B008",   # Depends() do FastAPI
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
